<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absen SECURITIRKAM</title>
<style>
body{font-family:Arial;background:#121212;color:#eee;margin:0;padding:20px}.container{max-width:500px;margin:auto;background:#1e1e1e;padding:25px;border-radius:10px}h1{text-align:center;color:#4da3ff}label{display:block;margin-top:15px;font-weight:bold}input,textarea{width:100%;padding:12px;margin-top:5px;background:#333;border:1px solid #444;border-radius:5px;color:#eee;box-sizing:border-box}.btn{padding:15px 20px;border:none;border-radius:5px;cursor:pointer;width:100%;margin-top:20px;font-weight:bold;font-size:16px;background:#4da3ff;color:#121212}#status{text-align:center;margin-top:15px;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>ABSEN SECURITIRKAM</h1>
<form id="formAbsen">
<label>Nama Petugas</label>
<input type="text" name="nama" required>

<label>Shift / Tugas</label>
<input type="text" name="shift" required>

<label>Catatan</label>
<textarea name="catatan" rows="3" placeholder="Opsional"></textarea>

<input type="hidden" name="waktu" id="inputWaktu">

<button type="submit" class="btn">KIRIM ABSEN</button>
<p id="status"></p>
</form>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOLAymN4N4nPr_EuGe9DiBSBQmRXDxTTPdd0TAbVjv_uBysLBKW6zdUlKJlSrLAIH5eQ/exec"; // JANGAN LUPA GANTI

document.getElementById('formAbsen').onsubmit = async function(e){
  e.preventDefault();
  document.getElementById('inputWaktu').value = new Date().toLocaleString('id-ID');
  document.getElementById('status').innerText = "Mengirim...";
  
  try {
    await fetch(SCRIPT_URL, {method:'POST', body:new FormData(this)});
    document.getElementById('status').innerText = "✅ Berhasil Terkirim!";
    document.getElementById('status').style.color="#4CAF50";
    this.reset();
  } catch(err) {
    document.getElementById('status').innerText = "❌ Gagal Kirim";
    document.getElementById('status').style.color="#ff6b6b";
  }
}
</script>
</body>
</html>
