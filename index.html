<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absen SECURITIRKAM</title>
<style>
body{font-family:'Arial';background:#121212;color:#eee;margin:0;padding:20px}.container{max-width:600px;margin:auto;background:#1e1e1e;padding:20px;border-radius:10px}h1{text-align:center;color:#4da3ff}label{display:block;margin-top:15px;font-weight:bold}input,textarea{width:100%;padding:10px;margin-top:5px;background:#333;border:1px solid #444;border-radius:5px;color:#eee;box-sizing:border-box}button{background:#4da3ff;color:#121212;padding:12px 20px;border:none;border-radius:5px;cursor:pointer;width:100%;margin-top:20px;font-size:16px;font-weight:bold}button:disabled{background:#555}#status{text-align:center;margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>ABSEN SECURITIRKAM</h1>
<form id="formAbsen">
<label>Nama Petugas</label>
<input type="text" id="nama" required>

<label>Shift / Tugas</label>
<input type="text" id="shift" placeholder="Contoh: Pagi, Patroli, Jaga Pintu" required>

<label>Catatan</label>
<textarea id="catatan" rows="3"></textarea>

<button type="submit" id="btnKirim">KIRIM ABSEN</button>
<p id="status"></p>
</form>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbnx6txP9e_F70oEfoR4qzVnP-OrD3LO7FRsmqsRYMFN6D-UXNMRFmLdpVJBeXPq33og/exec"; // <-- JANGAN LUPA GANTI INI

document.getElementById('formAbsen').onsubmit = async function(e){
  e.preventDefault();
  const btn = document.getElementById('btnKirim');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.innerText = "Mengirim...";
  
  const data = {
    waktu: new Date().toLocaleString('id-ID'),
    nama: document.getElementById('nama').value,
    shift: document.getElementById('shift').value,
    catatan: document.getElementById('catatan').value
  };

  try {
    await fetch(SCRIPT_URL, {method: 'POST', mode: 'no-cors', body: JSON.stringify(data)});
    status.innerText = "✅ Absen Berhasil Terkirim ke Google Sheet!";
    status.style.color = "#4CAF50";
    this.reset();
  } catch (error) {
    status.innerText = "❌ Gagal Kirim. Cek Link Script";
    status.style.color = "#ff6b6b";
  }
  btn.disabled = false;
}
</script>
</body>
</html>
